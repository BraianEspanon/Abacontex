name: Frontend Release (Promote Image)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Define SHA source (manual or from mapping strategy)
        run: echo "SHA_SOURCE=${{ github.event.inputs.sha }}" >> $GITHUB_ENV

      - name: Pull image built in staging
        run: |
          docker pull ghcr.io/braianespanon/abacontex-frontend:${SHA_SOURCE}

      - name: Tag image as release
        run: |
          docker tag ghcr.io/braianespanon/abacontex-frontend:${SHA_SOURCE} \
                     ghcr.io/braianespanon/abacontex-frontend:${VERSION}

          docker tag ghcr.io/braianespanon/abacontex-frontend:${SHA_SOURCE} \
                     ghcr.io/braianespanon/abacontex-frontend:latest

      - name: Push release tags
        run: |
          docker push ghcr.io/braianespanon/abacontex-frontend:${VERSION}
          docker push ghcr.io/braianespanon/abacontex-frontend:latest