name: Backend Image CI (Staging Build)

on:
  push:
    branches:
      - test
    paths:
      - 'backend/**'
      - '.github/workflows/backend-image-ci.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag (SHA)
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build \
            -f ./backend/Dockerfile.release \
            -t ghcr.io/braianespanon/abacontex-backend:${IMAGE_TAG} \
            -t ghcr.io/braianespanon/abacontex-backend:staging \
            ./backend

      - name: Push Docker image (SHA)
        run: |
          docker push ghcr.io/braianespanon/abacontex-backend:${IMAGE_TAG}
          docker push ghcr.io/braianespanon/abacontex-backend:staging