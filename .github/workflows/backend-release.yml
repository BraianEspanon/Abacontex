name: Backend Release (Promote Image)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Pull staging image
        run: |
          docker pull ghcr.io/braianespanon/abacontex-backend:staging

      - name: Tag image as release
        run: |
          docker tag ghcr.io/braianespanon/abacontex-backend:staging \
                     ghcr.io/braianespanon/abacontex-backend:${VERSION}

          docker tag ghcr.io/braianespanon/abacontex-backend:staging \
                     ghcr.io/braianespanon/abacontex-backend:latest

      - name: Push release tags
        run: |
          docker push ghcr.io/braianespanon/abacontex-backend:${VERSION}
          docker push ghcr.io/braianespanon/abacontex-backend:latest