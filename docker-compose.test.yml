services:
  backend:
    image: ghcr.io/braianespanon/abacontex-backend:${BACKEND_TAG}
    container_name: abacontex-backend-test

    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ENVIRONMENT: ${VITE_ENVIRONMENT}

      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}

      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      KEYCLOAK_FRONTEND_CLIENT_ID: ${KEYCLOAK_FRONTEND_CLIENT_ID}
      KEYCLOAK_TESTING_CLIENT_ID: ${KEYCLOAK_TESTING_CLIENT_ID}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}

      FRONTEND_URL: ${FRONTEND_URL}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_OCR_MODELS: ${GEMINI_OCR_MODELS}
      OCR_MAX_FILE_SIZE_MB: ${OCR_MAX_FILE_SIZE_MB}
      OCR_MOCK_ENABLED: ${OCR_MOCK_ENABLED}

      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL_GENERACION: ${GROQ_MODEL_GENERACION}

    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    image: ghcr.io/braianespanon/abacontex-frontend:${FRONTEND_TAG}
    container_name: abacontex-frontend-test

    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL}
      VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM}
      VITE_KEYCLOAK_CLIENT: ${VITE_KEYCLOAK_CLIENT}
      VITE_KEYCLOAK_REDIRECT_URI: ${VITE_KEYCLOAK_REDIRECT_URI}
      VITE_ENVIRONMENT: ${VITE_ENVIRONMENT}

  postgres:
    image: postgres:17
    container_name: abacontex-postgres-test

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
      PGTZ: UTC

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - postgres_test_data:/var/lib/postgresql/data

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:26.2

    container_name: abacontex-keycloak-test

    command:
      - start
      - --import-realm

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      KC_HTTP_ENABLED: "true"
      KC_PROXY: edge

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_HOSTED_DOMAIN: ${GOOGLE_HOSTED_DOMAIN}

      SMTP_DEBUG: ${SMTP_DEBUG}
      SMTP_STARTTLS: ${SMTP_STARTTLS}
      SMTP_AUTH: ${SMTP_AUTH}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      SMTP_SSL: ${SMTP_SSL}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}

    volumes:
      - ./keycloak/themes:/opt/keycloak/themes
      - ./keycloak/realm-export.prod.json:/opt/keycloak/data/import/realm.json
      - keycloak_test_data:/opt/keycloak/data

  mailpit:
    image: axllent/mailpit:latest

    container_name: abacontex-mailpit-test

    ports:
      - "${SMTP_PORT}:1025" # SMTP
      - "${MAILPIT_PORT}:8025" # Web UI

  reverse-proxy:
    image: nginx:alpine
    container_name: abacontex-proxy-test
    restart: always
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_HTTPS_PORT:-443}:443"
    volumes:
      - ./proxy/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./proxy/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
      - keycloak

volumes:
  postgres_test_data:
  keycloak_test_data:
