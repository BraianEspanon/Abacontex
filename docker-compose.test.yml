services:
  traefik:
    image: traefik:latest
    container_name: abacontex-traefik-test
    restart: unless-stopped
    environment:
      - DOCKER_API_VERSION=1.44
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.api.address=:3000"
      - "--entrypoints.auth.address=:8080"
      - "--entrypoints.mailpit.address=:8025"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.myresolver.acme.tlschallenge=true"
      - "--certificatesresolvers.myresolver.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
      - "${BACKEND_PORT:-3000}:3000"
      - "${KEYCLOAK_PORT:-8080}:8080"
      - "${MAILPIT_PORT:-8025}:8025"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_test_certificates:/letsencrypt

  backend:
    image: ghcr.io/braianespanon/abacontex-backend:${BACKEND_TAG}
    container_name: abacontex-backend-test
    restart: unless-stopped

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.backend.entrypoints=api"
      - "traefik.http.routers.backend.tls.certresolver=myresolver"
      - "traefik.http.services.backend.loadbalancer.server.port=3000"

    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ENVIRONMENT: ${VITE_ENVIRONMENT}

      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}

      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      KEYCLOAK_FRONTEND_CLIENT_ID: ${KEYCLOAK_FRONTEND_CLIENT_ID}
      KEYCLOAK_TESTING_CLIENT_ID: ${KEYCLOAK_TESTING_CLIENT_ID}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}

      FRONTEND_URL: ${FRONTEND_URL}

      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_OCR_MODELS: ${GEMINI_OCR_MODELS}
      OCR_MAX_FILE_SIZE_MB: ${OCR_MAX_FILE_SIZE_MB}
      OCR_MOCK_ENABLED: ${OCR_MOCK_ENABLED}

      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL_GENERACION: ${GROQ_MODEL_GENERACION}

    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    image: ghcr.io/braianespanon/abacontex-frontend:${FRONTEND_TAG}
    container_name: abacontex-frontend-test
    restart: unless-stopped

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=myresolver"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL}
      VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM}
      VITE_KEYCLOAK_CLIENT: ${VITE_KEYCLOAK_CLIENT}
      VITE_KEYCLOAK_REDIRECT_URI: ${VITE_KEYCLOAK_REDIRECT_URI}
      VITE_ENVIRONMENT: ${VITE_ENVIRONMENT}

  postgres:
    image: postgres:17
    container_name: abacontex-postgres-test
    restart: unless-stopped

    ports:
      - "${POSTGRES_PORT}:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: UTC
      PGTZ: UTC

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.2

    container_name: abacontex-keycloak-test
    restart: unless-stopped

    command:
      - start
      - --import-realm

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: https://${DOMAIN}:8080
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded

      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_HOSTED_DOMAIN: ${GOOGLE_HOSTED_DOMAIN}

      SMTP_DEBUG: ${SMTP_DEBUG}
      SMTP_STARTTLS: $SMTP_STARTTLS
      SMTP_AUTH: ${SMTP_AUTH}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      SMTP_SSL: ${SMTP_SSL}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.keycloak.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.keycloak.entrypoints=auth"
      - "traefik.http.routers.keycloak.tls.certresolver=myresolver"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"

    volumes:
      - ./keycloak/themes:/opt/keycloak/themes
      - ./keycloak/realm-export.prod.json:/opt/keycloak/data/import/realm.json

  mailpit:
    image: axllent/mailpit:latest

    container_name: abacontex-mailpit-test
    restart: unless-stopped

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailpit.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.mailpit.entrypoints=mailpit"
      - "traefik.http.routers.mailpit.tls.certresolver=myresolver"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"

    ports:
      - "${SMTP_PORT}:1025" # SMTP

volumes:
  postgres_test_data:
  traefik_test_certificates:
