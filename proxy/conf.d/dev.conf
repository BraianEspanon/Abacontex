# ==============================================================================
# Abacontex - Reverse Proxy Nginx (Entorno de Desarrollo)
# ==============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream frontend_dev {
    server frontend:5173;
}

upstream backend_dev {
    server backend:3000;
}

upstream keycloak_dev {
    server keycloak:8080;
}

server {
    listen 80 default_server;
    server_name localhost 127.0.0.1 _;

    client_max_body_size 25M;

    # Proxy headers comunes por defecto
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 1. Healthcheck directo del Backend
    location /health {
        proxy_pass http://backend_dev/health;
    }

    # 2. Backend API (con prefijo /api/)
    location = /api {
        return 301 /api/;
    }

    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend_dev;
    }

    # 3. WebSockets (Socket.IO del Backend)
    location /socket.io/ {
        proxy_pass http://backend_dev/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }

    # 4. Keycloak IAM (rutas nativas de autenticación)
    location ~* ^/(realms|resources|admin|js) {
        proxy_pass http://keycloak_dev;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # 5. Frontend SPA con Vite Dev Server y HMR (Hot Module Replacement WebSockets)
    location / {
        proxy_pass http://frontend_dev;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }
}
