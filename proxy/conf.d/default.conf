# ==============================================================================
# Abacontex - Reverse Proxy Nginx Configuration (Producción con SSL/TLS)
# ==============================================================================

# Soporte de WebSockets para Socket.IO
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Definición de Upstreams hacia los contenedores de la red Docker
upstream frontend_service {
    server frontend:80;
}

upstream backend_service {
    server backend:3000;
}

upstream keycloak_service {
    server keycloak:8080;
}

# ==============================================================================
# 1. REDIRECCIÓN GLOBAL HTTP -> HTTPS (Puerto 80)
# ==============================================================================
server {
    listen 80 default_server;
    server_name _;

    # Ruta para validación de certificados Let's Encrypt (Certbot HTTP-01)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirección obligatoria a HTTPS para todo el tráfico web
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# 2. SEGURIDAD SSL: Rechazar accesos directos por IP o dominios no reconocidos
# ==============================================================================
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 444; # Cierra la conexión inmediatamente para mitigar escaneos y bots
}

# ==============================================================================
# 3. FRONTEND WEB & MAIN ROUTING (abacontex.*, app.* o localhost para pruebas)
# ==============================================================================
server {
    listen 443 ssl;
    server_name ~^(abacontex\..+|app\..+|frontend\..+)$ localhost 127.0.0.1;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 25M;

    # 1. Healthcheck directo del Backend
    location /health {
        proxy_pass http://backend_service/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 2. Backend API (con prefijo /api/)
    location = /api {
        return 301 /api/;
    }

    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 3. WebSockets (Socket.IO del Backend)
    location /socket.io/ {
        proxy_pass http://backend_service/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }

    # 4. Keycloak IAM - Consola de Administración y Realm Master (Restringidos a VPN / Red Privada)
    location ~* ^/(admin|realms/master) {
        # Permitir acceso exclusivamente a través de la red privada VPN (Tailscale: 100.64.0.0/10) y localhost
        allow 100.64.0.0/10;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        error_page 403 =404 @not_found; # Modo sigilo: responde 404 nativo a solicitudes no autorizadas

        proxy_pass http://keycloak_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # 5. Keycloak IAM - Rutas Públicas (Exclusivamente Realm del ERP y Recursos Estáticos)
    location ~* ^/(realms/abacontex|resources|js) {
        proxy_pass http://keycloak_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # 6. Modo sigilo: respuesta 404 nativa sin tocar el frontend
    location @not_found {
        return 404;
    }

    # 7. Frontend SPA
    location / {
        proxy_pass http://frontend_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ==============================================================================
# 4. BACKEND API & WEBSOCKETS (api.*)
# ==============================================================================
server {
    listen 443 ssl;
    server_name ~^(api\..+)$;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 15M; # Permite carga de comprobantes y facturas para OCR

    location / {
        proxy_pass http://backend_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Soporte para WebSockets en tiempo real (Socket.IO)
    location /socket.io/ {
        proxy_pass http://backend_service/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }
}

# ==============================================================================
# 5. KEYCLOAK IAM (auth.* o keycloak.*)
# ==============================================================================
server {
    listen 443 ssl;
    server_name ~^(auth\..+|keycloak\..+)$;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 1. Consola de Administración y Realm Master (Restringidos a VPN / Red Privada)
    location ~* ^/(admin|realms/master) {
        allow 100.64.0.0/10;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        error_page 403 =404 @not_found; # Modo sigilo: responde 404 nativo a solicitudes no autorizadas

        proxy_pass http://keycloak_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # 2. Rutas Públicas del Realm Institucional y Recursos
    location ~* ^/(realms/abacontex|resources|js) {
        proxy_pass http://keycloak_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # 3. Bloquear cualquier otra ruta no reconocida en el subdominio de autenticación
    location / {
        return 404;
    }

    location @not_found {
        return 404;
    }
}
