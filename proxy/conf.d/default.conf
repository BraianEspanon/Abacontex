# ==============================================================================
# Abacontex - Reverse Proxy Nginx Configuration (Producción)
# ==============================================================================

# Soporte de WebSockets para Socket.IO
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Definición de Upstreams hacia los contenedores de la red Docker
upstream frontend_service {
    server frontend:80;
}

upstream backend_service {
    server backend:3000;
}

upstream keycloak_service {
    server keycloak:8080;
}

# ==============================================================================
# 1. SEGURIDAD: Rechazar accesos por IP directa o dominios no reconocidos
# ==============================================================================
server {
    listen 80 default_server;
    server_name _;
    return 444; # Cierra la conexión inmediatamente para mitigar escaneos y bots
}

# ==============================================================================
# 2. FRONTEND WEB & MAIN ROUTING (abacontex.*, app.* o localhost para pruebas)
# ==============================================================================
server {
    listen 80;
    server_name ~^(abacontex\..+|app\..+|frontend\..+)$ localhost 127.0.0.1;

    client_max_body_size 25M;

    # 1. Healthcheck directo del Backend
    location /health {
        proxy_pass http://backend_service/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Backend API (con prefijo /api/)
    location = /api {
        return 301 /api/;
    }

    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. WebSockets (Socket.IO del Backend)
    location /socket.io/ {
        proxy_pass http://backend_service/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }

    # 4. Keycloak IAM (rutas nativas de autenticación)
    location ~* ^/(realms|resources|admin|js) {
        proxy_pass http://keycloak_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # 5. Frontend SPA
    location / {
        proxy_pass http://frontend_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ==============================================================================
# 3. BACKEND API & WEBSOCKETS (api.*)
# ==============================================================================
server {
    listen 80;
    server_name ~^(api\..+)$;

    client_max_body_size 15M; # Permite carga de comprobantes y facturas para OCR

    location / {
        proxy_pass http://backend_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Soporte para WebSockets en tiempo real (Socket.IO)
    location /socket.io/ {
        proxy_pass http://backend_service/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_cache_bypass $http_upgrade;
    }
}

# ==============================================================================
# 4. KEYCLOAK IAM (auth.* o keycloak.*)
# ==============================================================================
server {
    listen 80;
    server_name ~^(auth\..+|keycloak\..+)$;

    location / {
        proxy_pass http://keycloak_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
